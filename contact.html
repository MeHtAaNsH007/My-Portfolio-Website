<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ansh Mehta | Contact</title>
<link rel="stylesheet" href="style.css">
<style>
    .contact-page-header {
        margin-bottom: 3.5rem;
        text-align: left;
    }
    .contact-story-headline {
        font-size: 3rem;
        font-weight: 800;
        letter-spacing: -0.03em;
        color: #ffffff;
        margin-bottom: 1rem;
        line-height: 1.2;
    }
    .contact-story-lead {
        font-size: 1.15rem;
        color: #94a3b8;
    }
    .contact-container {
        display: flex;
        justify-content: center;
    }
    .contact-form {
        background-color: #0d0d0d;
        padding: 3rem;
        border-radius: 12px;
        border: 1px solid #1f1f1f;
        width: 100%;
        max-width: 650px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
    }
    .form-group {
        margin-bottom: 1.75rem;
    }
    .form-group label {
        display: block;
        font-size: 1rem;
        font-weight: 600;
        color: #cbd5e1;
        margin-bottom: 0.75rem;
    }
    .form-group input,
    .form-group textarea {
        width: 100%;
        padding: 1rem;
        background-color: #050505;
        border: 1px solid #1f1f1f;
        border-radius: 8px;
        color: #f8fafc;
        font-size: 1.05rem;
        transition: border-color 0.2s;
    }
    .form-group input:focus,
    .form-group textarea:focus {
        outline: none;
        border-color: #ef4444;
    }
    .submit-btn {
        width: 100%;
        background-color: #ef4444;
        color: #ffffff;
        padding: 1rem;
        border: none;
        border-radius: 8px;
        font-size: 1.1rem;
        font-weight: 700;
        cursor: pointer;
        transition: background-color 0.2s, transform 0.1s;
    }
    .submit-btn:hover {
        background-color: #dc2626;
    }
    .submit-btn:active {
        transform: scale(0.98);
    }
</style>
</head>
<body>
<nav class="top-nav">
    <a href="index.html">Profile</a>
    <a href="skills.html">Skills</a>
    <a href="projects.html">Projects</a>
    <a href="certifications.html">Certifications</a>
    <a href="contact.html" class="active">Contact</a>
</nav>

<main class="page-container">
    <section class="contact-page-header">
        <h1 class="contact-story-headline">Let's Build Something Together</h1>
        <p class="contact-story-lead">Have a question, collaboration idea, or want to connect? Drop a message below and it will land straight in my inbox.</p>
    </section>

    <div class="contact-container">
        <form class="contact-form" action="https://api.web3forms.com/submit" method="POST">
            
            <input type="hidden" name="access_key" value="YOUR_ACCESS_KEY_HERE">

            <div class="form-group">
                <label for="name">Your Name</label>
                <input type="text" id="name" name="name" required placeholder="Enter your full name">
            </div>

            <div class="form-group">
                <label for="email">Your Email</label>
                <input type="email" id="email" name="email" required placeholder="Enter your email address">
            </div>

            <div class="form-group">
                <label for="message">Your Message</label>
                <textarea id="message" name="message" rows="5" required placeholder="Type your message here..."></textarea>
            </div>

            <input type="hidden" name="redirect" value="https://web3forms.com/success">

            <button type="submit" class="submit-btn">Send Message</button>
        </form>
    </div>
</main>
</body>
</html>
